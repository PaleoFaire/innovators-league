name: Email the Action Brief

# THE ROUTE
#
#   this workflow  ──email──▶  stephenmcbride92@gmail.com
#                                       │
#                              morning dossier ingests the inbox
#                                       │
#                                       ▼
#                    stephen@rationaloptimistsociety.com, 06:00 Gulf
#
# The brief is NOT sent to Stephen directly. It is sent INTO the inbox the
# dossier reads, so it arrives as a section of the dossier rather than as a
# second thing to open. MAIL_TO is therefore the gmail address, deliberately —
# pointing it at stephen@rationaloptimistsociety.com would bypass the dossier
# and produce exactly the extra daily email this is meant to avoid.
#
# Timing is load-bearing: the dossier goes out at 02:00 UTC, the brief builds at
# 00:30 UTC and mails immediately, leaving ~90 minutes for ingestion.
#
# ─── ONE-TIME SETUP (Stephen) ────────────────────────────────────────────
# Add three repository secrets under Settings → Secrets and variables →
# Actions. I cannot add these myself and should never see the password.
#
#   MAIL_USERNAME   the Gmail address that SENDS the mail
#   MAIL_PASSWORD   a Google APP PASSWORD, not the account password.
#                   Generate at https://myaccount.google.com/apppasswords
#                   (requires 2-Step Verification to be on). An app password is
#                   scoped to one app and revocable on its own, which is why it
#                   is the right credential here.
#   MAIL_TO         stephenmcbride92@gmail.com
#
# Until those exist the job skips cleanly rather than failing, so nothing goes
# red in the Actions tab while it waits.
#
# A note on the sender: mail from your own address to your own address is the
# simplest setup and needs no domain configuration. If you would rather it came
# from stephen@rationaloptimistsociety.com, that works too — point
# MAIL_USERNAME at it and use that account's app password, keeping MAIL_TO on
# the gmail address the dossier watches.

on:
  workflow_run:
    workflows: ["The Action Brief"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    name: Send to the dossier inbox
    runs-on: ubuntu-latest
    # Only mail a brief that was actually built successfully.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check the brief has something in it
        id: check
        run: |
          if [ ! -f data/action_brief.md ]; then
            echo "send=false" >> $GITHUB_OUTPUT
            echo "No brief file — nothing to send."
            exit 0
          fi
          N=$(python3 -c "import json;print(json.load(open('data/action_brief.json'))['new'])" 2>/dev/null || echo 0)
          SUBJ=$(python3 -c "import json;print(json.load(open('data/action_brief.json')).get('subject','[IL Action Brief] update'))" 2>/dev/null || echo "[IL Action Brief] update")
          echo "count=$N" >> $GITHUB_OUTPUT
          echo "subject=$SUBJ" >> $GITHUB_OUTPUT
          echo "send=true" >> $GITHUB_OUTPUT
          # ALWAYS send, including on a quiet day.
          #
          # For a human inbox the opposite is right — a daily "nothing happened"
          # email trains you to ignore the sender. But this is not read by a
          # human. It is ingested by the dossier, which then decides whether the
          # section is worth rendering. A predictable daily arrival is what an
          # ingestion pipeline needs: a missing email is indistinguishable from
          # a broken one, and silence would hide a failure for days.
          echo "Brief has $N new items — sending regardless."

      - name: Confirm the mail secrets exist
        id: creds
        run: |
          if [ -n "${{ secrets.MAIL_USERNAME }}" ] && [ -n "${{ secrets.MAIL_PASSWORD }}" ] && [ -n "${{ secrets.MAIL_TO }}" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::notice::Mail secrets not set yet — see the header of this workflow file for the three needed."
          fi

      - name: Render the brief as HTML
        if: steps.check.outputs.send == 'true' && steps.creds.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import json, html, pathlib
          d = json.load(open("data/action_brief.json"))
          COLOR = {"FUND": "#2F6B4F", "MEDIA": "#26557C", "POD": "#9A6B18"}
          SANS = "-apple-system,Segoe UI,sans-serif"
          esc = html.escape

          def E(s):
              # escape THEN entity-encode typographic punctuation: a mislabeled
              # charset anywhere between SMTP and the reader turns a raw "\u00b7"
              # into mojibake, and entities are immune.
              return esc(s).replace("\u00b7", "&middot;").replace("\u2014", "&mdash;")

          def chip(t):
              c = COLOR.get(t, "#6B747E")
              return (f'<span style="font:600 10px/1 {SANS};letter-spacing:.08em;'
                      f'color:{c};border:1px solid {c};border-radius:2px;'
                      f'padding:3px 5px;margin-right:4px">{t}</span>')

          def chips(g): return "".join(chip(t) for t in g["tags"])

          def linked(g, inner):
              u = esc(g.get("url") or "")
              return f'<a href="{u}" style="color:#14181D;text-decoration:none">{inner}</a>' if u else inner

          parts = []
          lede = d.get("lede")
          if lede:
              # THE LEDE — one story, sentence form, visually dominant.
              s2 = " ".join(x[0].upper() + x[1:] + "." for x in
                            ([lede["context"]] if lede.get("context") else []) +
                            ([lede["why"]] if lede.get("why") else []))
              parts.append(f"""
              <div style="border-left:3px solid #B8860B;padding:2px 0 2px 14px;margin:4px 0 22px">
                <div style="font:600 12px/1 {SANS};letter-spacing:.1em;color:#9A6B18">THE LEDE</div>
                <div style="font:600 19px/1.35 Georgia,serif;color:#14181D;margin-top:8px">
                  {linked(lede, esc(lede['company']))} <span style="font-weight:400">{E(lede['headline'])}</span>
                </div>
                {'<div style="font:400 15px/1.5 '+SANS+';color:#3D454E;margin-top:5px">'+E(lede['detail'])+'</div>' if lede.get('detail') else ''}
                {'<div style="font:400 13px/1.55 '+SANS+';color:#6B747E;margin-top:6px">'+E(s2)+'</div>' if s2 else ''}
                <div style="margin-top:9px">{chips(lede)}</div>
              </div>""")

              for g in d.get("act_on", []):
                  sub = " · ".join(x for x in (g.get("context",""), g.get("why","")) if x)
                  also = "".join(f'<div style="font:400 12px/1.5 {SANS};color:#828C96">↳ also: {E(a["headline"])} ({esc(a["date"])})</div>'
                                 for a in g.get("also", []))
                  parts.append(f"""
                  <div style="padding:13px 0;border-top:1px solid #E4E5E4">
                    <div style="font:600 16px/1.35 {SANS};color:#14181D">
                      {linked(g, esc(g['company']))} <span style="font-weight:400">{E(g['headline'])}</span>
                    </div>
                    {'<div style="font:400 14px/1.5 '+SANS+';color:#3D454E;margin-top:3px">'+E(g['detail'])+'</div>' if g.get('detail') else ''}
                    {'<div style="font:400 13px/1.5 '+SANS+';color:#6B747E;margin-top:3px">'+E(sub)+'</div>' if sub else ''}
                    {also}
                    <div style="margin-top:7px">{chips(g)}</div>
                  </div>""")

              radar = d.get("radar", [])
              if radar:
                  rows = []
                  for g in radar:
                      bits = [g["headline"]]
                      if g.get("context"): bits.append(g["context"])
                      elif g.get("why"): bits.append(g["why"])
                      if g.get("momentum", 1) > 1: bits.append(f"+{g['momentum']-1} more")
                      rows.append(f'<div style="font:400 13px/1.7 {SANS};color:#3D454E">'
                                  f'<strong>{linked(g, esc(g["company"]))}</strong> &mdash; {" &middot; ".join(E(b) for b in bits)}</div>')
                  parts.append(f"""
                  <div style="border-top:1px solid #E4E5E4;padding-top:12px;margin-top:2px">
                    <div style="font:600 11px/1 {SANS};letter-spacing:.1em;color:#828C96;margin-bottom:7px">ON THE RADAR</div>
                    {''.join(rows)}
                  </div>""")

              if d.get("threads"):
                  th = " &middot; ".join(f"{b.replace('-', ' ')} &times;{n}" for b, n in d["threads"])
                  parts.append(f'<div style="font:400 12px/1.5 {SANS};color:#6B747E;margin-top:14px"><strong>Threads this week:</strong> {th}</div>')
          else:
              parts.append(f'<div style="font:400 15px/1.5 {SANS};color:#3D454E;padding:8px 0">'
                           'Nothing cleared the bar overnight — the pipeline ran and found '
                           'no new signal worth your attention.</div>')

          bb = d.get("below_bar") or {}
          if bb:
              total = sum(bb.values())
              top = ", ".join(f"{v} {k.replace('_',' ')}" for k, v in sorted(bb.items(), key=lambda kv: -kv[1])[:4])
              parts.append(f'<div style="font:400 12px/1.5 {SANS};color:#828C96;margin-top:14px">'
                           f'Below the bar: {total} more events logged ({E(top)}) — none needing you.</div>')

          body = f"""<div style="max-width:640px;margin:0 auto;padding:24px;background:#FFFFFF">
            <div style="font:600 22px/1.2 Georgia,serif;color:#14181D">The Action Brief</div>
            <div style="font:400 12px/1.5 {SANS};color:#828C96;margin:5px 0 16px">
              {d.get('companies', 0)} companies moved &middot; {d['scanned']} events scanned &middot; only what needs you is above the line
            </div>
            {''.join(parts)}
            <div style="font:400 11px/1.5 {SANS};color:#A0A8B0;margin-top:20px">
              Every line is a primary-source fact joined against the Innovators League database; nothing is model-written.
            </div>
          </div>"""
          pathlib.Path("brief_email.html").write_text(body)
          print("rendered:", "lede + %d act-on + %d radar" % (len(d.get("act_on",[])), len(d.get("radar",[]))) if lede else "quiet day")
          PY

      - name: Send
        if: steps.check.outputs.send == 'true' && steps.creds.outputs.ready == 'true'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: Innovators League <${{ secrets.MAIL_USERNAME }}>
          # The builder writes the subject: fixed "[IL Action Brief]" prefix so
          # the dossier filters deterministically, then the lede itself —
          # "Antares raising $85M · 9 more" says more than any count could.
          subject: ${{ steps.check.outputs.subject }}
          html_body: file://brief_email.html
          convert_markdown: false
          attachments: data/action_brief.md
