name: The Action Brief

# TIMING IS THE WHOLE POINT.
#
# This feeds the morning dossier, which ingests from stephenmcbride92@gmail.com
# and goes out to stephen@rationaloptimistsociety.com at 06:00 Gulf time —
# 02:00 UTC. The brief therefore has to be BUILT AND EMAILED BEFORE THEN.
#
# It used to run at 08:30 UTC, which is 12:30 in Abu Dhabi: six and a half
# hours after the dossier had already gone out. Every brief would have been a
# day stale, every day, and the failure would have been invisible — the emails
# arrive, they just arrive too late to be read.
#
# 00:30 UTC = 04:30 Gulf, leaving ~90 minutes for the build, the email and the
# dossier's own ingestion before it sends. The feeds it reads are written by
# the overnight and hourly syncs, so a pre-dawn build has yesterday's full day
# in it, which is what a morning briefing should cover.
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Days of feed history to consider (default 3)'
        required: false
        default: '3'

permissions:
  contents: write

jobs:
  digest:
    name: Build the action brief
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No pip install: the digest reads files the other jobs already wrote and
      # uses nothing outside the standard library. It makes no network calls,
      # costs nothing, and cannot fail because a third party is down.
      - name: Build digest
        run: python scripts/build_action_brief.py --since ${{ github.event.inputs.since || '3' }}

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/action_brief.md data/action_brief.json data/action_brief_state.json \
              data/trade_press_auto.json data/trade_press_status.json data/deals_auto.json
          if git diff --cached --quiet; then
            echo "No new items today — nothing to commit."
            exit 0
          fi
          # Put the headline count in the commit message so the repo's own
          # history reads as a log of what happened, not a wall of
          # "Auto-update" lines.
          N=$(python -c "import json;print(json.load(open('data/action_brief.json'))['new'])")
          git commit -m "📰 Action Brief: $N routed signals $(date -u +%Y-%m-%d)"
          git push

      - name: Show the digest in the run summary
        # So the whole briefing is readable from the Actions tab on a phone,
        # without cloning anything or opening the site.
        if: always()
        run: cat data/action_brief.md >> $GITHUB_STEP_SUMMARY
